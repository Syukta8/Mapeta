name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: false
        default: 'debug'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run client:build

      - name: Sync native Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: ./android/gradlew assembleDebug
        working-directory: android

      - name: Copy generated APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mapeta-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapeta-debug-apk
          path: mapeta-debug.apk
          retention-days: 14
